<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #E8ECEF;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        /* Structural Grid Line */
        .slide-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background-color: rgba(52, 73, 94, 0.2);
            z-index: 1;
        }
        .left-col {
            padding: 120px 60px 0 80px;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }
        .right-col {
            padding: 120px 80px 0 60px;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }
        .accent-bar {
            width: 80px;
            height: 8px;
            background-color: #E67E22;
            margin-bottom: 30px;
        }
        h2 {
            color: #1A2B3C;
            font-weight: 800;
            font-size: 56px;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 50px;
        }
        .decision-box {
            border: 2px solid #E67E22;
            padding: 30px;
            background-color: rgba(230, 126, 34, 0.1);
        }
        .decision-text {
            color: #1A2B3C;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-weight: 700;
            font-size: 24px;
            text-transform: uppercase;
            line-height: 1.4;
        }
        h3 {
            color: #1A2B3C;
            font-weight: 800;
            font-size: 32px;
            text-transform: uppercase;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .outcome-list {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .outcome-item {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }
        .outcome-bullet {
            width: 20px;
            height: 20px;
            background-color: #34495E;
            margin-top: 6px;
            flex-shrink: 0;
        }
        .outcome-text {
            color: #34495E;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 24px;
            line-height: 1.5;
        }
        .highlight {
            color: #E67E22;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="left-col">
            <div class="accent-bar"></div>
            <h2>Keputusan Yang Dibutuhkan Tim</h2>
            <div class="decision-box">
                <div class="decision-text">Setujui P0 sebelum menambah prompt baru</div>
            </div>
        </div>
        <div class="right-col">
            <h3>Hasil yang dituju:</h3>
            <div class="outcome-list">
                <div class="outcome-item">
                    <div class="outcome-bullet"></div>
                    <div class="outcome-text"><span class="highlight">Satu sumber kebenaran</span> untuk alur halaman dan panel.</div>
                </div>
                <div class="outcome-item">
                    <div class="outcome-bullet"></div>
                    <div class="outcome-text">Output AI <span class="highlight">tervalidasi</span> sebelum memengaruhi proyek.</div>
                </div>
                <div class="outcome-item">
                    <div class="outcome-bullet"></div>
                    <div class="outcome-text">Draft pengguna <span class="highlight">tetap aman</span> dan dapat dipulihkan.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
