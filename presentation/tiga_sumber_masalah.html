<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #E8ECEF;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            position: relative;
            padding: 60px 80px 0 80px;
            display: flex;
            flex-direction: column;
        }
        .header-section {
            margin-bottom: 60px;
        }
        .accent-bar {
            width: 60px;
            height: 8px;
            background-color: #E67E22;
            margin-bottom: 20px;
        }
        h2 {
            color: #1A2B3C;
            font-weight: 800;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }
        .data-table {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 2px solid #34495E;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        .table-header {
            background-color: #1A2B3C;
            color: #E8ECEF;
            font-weight: 700;
            font-size: 22px;
            padding: 20px 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .table-cell {
            padding: 30px;
            font-size: 24px;
            color: #34495E;
            line-height: 1.5;
            border-top: 2px solid #34495E;
        }
        .col-left {
            border-right: 2px solid #34495E;
            font-weight: 700;
        }
        .col-right {
            font-weight: 400;
        }
        .highlight {
            color: #E67E22;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-section">
            <div class="accent-bar"></div>
            <h2>Tiga Sumber Ketidaksesuaian Utama</h2>
        </div>
        
        <div class="data-table">
            <div class="table-header col-left">Masalah</div>
            <div class="table-header col-right">Dampak</div>
            
            <div class="table-cell col-left">
                <span class="highlight">Description tunggal</span> memuat semua panel
            </div>
            <div class="table-cell col-right">
                Cerita multi-halaman mudah terpotong atau berulang
            </div>
            
            <div class="table-cell col-left">
                Fallback <span class="highlight">plain text</span> dianggap sukses
            </div>
            <div class="table-cell col-right">
                Prompt tanpa struktur dapat masuk ke pipeline
            </div>
            
            <div class="table-cell col-left">
                Hasil AI <span class="highlight">langsung diterapkan</span>
            </div>
            <div class="table-cell col-right">
                Draft pengguna dapat tertimpa tanpa persetujuan
            </div>
        </div>
    </div>
</body>
</html>
